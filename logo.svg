<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5e0d6"/>
      <stop offset="1" stop-color="#cdc7bb"/>
    </linearGradient>
  </defs>

  <!-- LEAVES (drawn first; bowl overlaps their base) -->
  <!-- left leaf: sage -->
  <g transform="translate(148 250) rotate(-37) scale(0.86)">
    <path d="M0,-128 C52,-70 52,74 0,128 C-52,74 -52,-70 0,-128 Z" fill="#7d8a58"/>
    <path d="M0,-72 L0,118" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- right leaf: terracotta -->
  <g transform="translate(364 250) rotate(37) scale(0.86)">
    <path d="M0,-128 C52,-70 52,74 0,128 C-52,74 -52,-70 0,-128 Z" fill="#b06f4a"/>
    <path d="M0,-72 L0,118" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- center leaf: dark green -->
  <g transform="translate(256 164) scale(1.1)">
    <path d="M0,-140 C56,-74 56,82 0,140 C-56,82 -56,-74 0,-140 Z" fill="#2e3f2a"/>
    <path d="M0,-80 L0,128" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- BOWL (concrete half-circle) -->
  <path d="M64,300 L448,300 A192,182 0 0 1 64,300 Z" fill="url(#bowl)"/>
</svg>
